apiVersion: v1
kind: Pod

metadata:
  name: nginx-pod
  labels:
    app: nginx

spec:
  containers:
    - name: nginx-container
      image: nginx:stable
      ports:
        - containerPort: 80

    - name: log-sidecar
      image: busybox
      command: ["sh", "-c", "while true; do echo hello; sleep 30; done"]


      