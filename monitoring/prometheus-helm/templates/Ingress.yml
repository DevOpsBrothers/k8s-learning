apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app_name }}-ingress
  namespace: {{ .Values.namespace }}
  # annotations:
  #   traefik.ingress.kubernetes.io/router.middlewares: monitoring-ns-prom-stripprefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.hostIp }}.nip.io
      http:
        paths:
          - path: /{{ .Values.app_name }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.app_name }}-svc
                port:
                  number: 80