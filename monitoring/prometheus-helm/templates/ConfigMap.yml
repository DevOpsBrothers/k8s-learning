apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.app_name }}-configmap
  namespace: {{ .Values.namespace }}
data:
  {{ .Values.app_name }}.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s

    rule_files:
      # - "first.rules"
      # - "second.rules"

    scrape_configs:
      - job_name: {{ .Values.app_name }}
        static_configs:
          - targets: ['0.0.0.0:9090']
