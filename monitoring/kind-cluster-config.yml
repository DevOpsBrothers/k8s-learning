kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Web & App Ports
      - containerPort: 80
        hostPort: 80
      - containerPort: 443
        hostPort: 443
      - containerPort: 8000
        hostPort: 8000
      - containerPort: 8080
        hostPort: 8080
      # Additional 10 Application Ports
      - containerPort: 8081
        hostPort: 8081
      - containerPort: 8082
        hostPort: 8082
      - containerPort: 8083
        hostPort: 8083
      - containerPort: 8084
        hostPort: 8084
      - containerPort: 8085
        hostPort: 8085
      - containerPort: 8086
        hostPort: 8086
      - containerPort: 8087
        hostPort: 8087
      - containerPort: 8088
        hostPort: 8088
      - containerPort: 8089
        hostPort: 8089
      - containerPort: 8090
        hostPort: 8090
      # Monitoring & Observability Ports
      - containerPort: 3000
        hostPort: 3000 # Grafana
      - containerPort: 9090
        hostPort: 9090 # Prometheus
      - containerPort: 9093
        hostPort: 9093 # Alertmanager
      - containerPort: 3100
        hostPort: 3100 # Loki
      - containerPort: 9080
        hostPort: 9080 # Promtail/Loki gateway
      - containerPort: 9411
        hostPort: 9411 # Zipkin
      - containerPort: 16686
        hostPort: 16686 # Jaeger UI
      - containerPort: 14268
        hostPort: 14268 # Jaeger Collector
      # Database Ports
      - containerPort: 5432
        hostPort: 5432 # PostgreSQL
      - containerPort: 3306
        hostPort: 3306 # MySQL
      - containerPort: 6379
        hostPort: 6379 # Redis
      - containerPort: 27017
        hostPort: 27017 # MongoDB
      # NodePort Range
      - containerPort: 30080
        hostPort: 30080
  - role: worker
  - role:
      worker
      # kind create cluster --config kind-cluster-config.yml
